name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK on EAS
        run: eas build --platform android --profile preview --non-interactive --wait

      - name: Get APK download URL
        run: |
          echo "============================================"
          echo "构建完成！"
          echo "去 https://expo.dev 你的账号里下载 APK"
          echo "或者执行以下命令查看下载链接："
          eas build:list --platform android --limit 1 --json
          echo "============================================"
