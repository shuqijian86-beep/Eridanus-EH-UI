name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Check login
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas whoami

      - name: Create EAS project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas init --account 777777jjjwwfgc --non-interactive

      - name: Create eas.json
        run: |
          cat > eas.json << 'EASEOF'
          {
            "cli": {
              "version": ">= 3.0.0",
              "appVersionSource": "local"
            },
            "build": {
              "preview": {
                "android": {
                  "buildType": "apk",
                  "distribution": "internal"
                }
              },
              "production": {
                "android": {
                  "buildType": "apk"
                }
              }
            }
          }
          EASEOF

      - name: Build APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive --wait

      - name: Show download link
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "========================================="
          echo "构建完成！下载方式："
          echo "1. 去 https://expo.dev 登录下载"
          echo "2. 或者看下面的 JSON 里的 buildUrl"
          echo "========================================="
          eas build:list --platform android --limit 1 --json
